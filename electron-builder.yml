appId: com.codeagent.desktop
productName: CodeAgent
asar: false
npmRebuild: false
directories:
  output: build/release
  # electron-builder 默认把 build/ 当作 buildResources 并从 app 中排除，
  # 与 build/dist 冲突，这里显式移到 build/build-resources。
  buildResources: build/build-resources
files:
  - build/dist/**
  - resources/generated/**
  - package.json
  - node_modules/**
win:
  target:
    - dir
  # zip 的文件名；安装程序使用 nsis.artifactName。
  artifactName: CodeAgent-${version}-windows-${arch}.${ext}
# 发行版：安装程序（安装一次，之后直接启动）与免安装 zip。
# 不用 portable：它每次启动都要把 1 万多个文件解压到临时目录，耗时数分钟。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerLanguages: [zh_CN]
  language: '2052'
  shortcutName: CodeAgent
  artifactName: CodeAgent-${version}-windows-${arch}-setup.${ext}
